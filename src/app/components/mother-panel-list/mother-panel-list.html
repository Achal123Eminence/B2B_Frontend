<div class="card bg-light-info shadow-none position-relative overflow-hidden" style="border: none;">
  <div class="card-body px-4 py-2">
    <div class="row align-items-center">
      <div class="col-9">
        <h4 class="fw-semibold mb-8" style="color: white;font-size: 1.4rem;">Mother Panel Lists</h4>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb" style="margin-bottom: 9px;">
            <li class="breadcrumb-item" style="color: #aaa"><a class="text-muted" style="text-decoration: none;color: #aaa !important;" routerLink="/home">Dashboard</a> <span style="color: white;"> • </span> Mother Panel Lists</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>

<div class="mother-panel-container">
    <div class="controls">
        <label>
            Show
            <select>
                <option [value]="10">10</option>
                <option [value]="25">25</option>
                <option [value]="50">50</option>
                <option [value]="100">100</option>
            </select>
            entries
        </label>
    
        <input type="text" placeholder="Search" />
    </div>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>User Name</th>
                <th>Mother Panel</th>
                <th>Website</th>
                <th>Action</th>
                <th>Portfolio</th>
            </tr>
        </thead>
        <tbody>
            @for (item of motherPanelList(); let i =$index; track item._id) {
                <tr>
                    <td>{{i + 1}}</td>
                    <td>{{item.userId.username}}</td>
                    <td>{{item.mother_panel}}</td>
                    <td>
                        <button class="add-website" (click)="addWebsite(item._id)" >Add Website</button>
                    </td>
                    <td>
                        <button class="edit-btn" (click)="openEditModal(item)">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="delete-btn" (click)="confirmAndDeleteMotherPanel(item._id)">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </td>
                    <td>
                        <button class="make-changes" routerLink="/website-list/{{item._id}}">Make Changes</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="editMotherPanelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="background: #2a3447; color: white;">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="font-size: 1rem;">Edit Mother Panel Detail</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="editForm" (ngSubmit)="onSubmitEditMotherPanel()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Select User</label>
              <select class="form-select" formControlName="userId">
                <option value="">Select User</option>
                @for (item of userslist(); track $index) {
                    <option [value]="item._id">{{ item.username }}</option>
                }
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Mother Panel Name</label>
              <input type="text" class="form-control" formControlName="mother_panel" placeholder="Enter name" />
            </div>
          </div>

          <div class="text-end mt-4">
            <button type="submit" class="btn btn-warning px-4" [disabled]="editForm.invalid">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
